# Test fixtures that are too large to keep in git.
#
# Small synthetic fixtures live in `test/data/` and are committed; this
# file indexes the rest, which are fetched on demand and cached. A test that
# needs one is skipped when it cannot be fetched, so the suite stays green
# offline.
#
# To add a file: upload it, then
#
#     python test/fixtures.py stanza <path> <key>
#
# which prints the entry below with its size and digest filled in.


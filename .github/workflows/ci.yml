name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set Up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # No `uv sync`: ruff imports none of the scientific stack, and resolving
    # it costs minutes of CI per push for a lint that takes under a second.
    # Pinned to the version in uv.lock so local and CI agree.
    - name: Lint with ruff
      run: uvx ruff@0.16.1 check clodius scripts test --output-format=github

  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set Up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: uv sync --locked

    - name: Run Unit Tests
      run: uv run pytest

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set Up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: uv run ruff check clodius scripts test

  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set Up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: uv sync --locked

    - name: Run Unit Tests
      run: uv run pytest

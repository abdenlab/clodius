[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clodius"
version = "0.22.2"
description = "Tile generation for big data"
authors = [
    { name = "Peter Kerpedjiev", email = "pkerpedjiev@gmail.com" },
]
dependencies = [
    "Click>=7",
    "cooler>0.9.0",
    "dask",
    "h5py",
    "negspy",
    "numpy",
    "pandas>=1.0",
    "pybbi>=0.2.0",
    "pydantic",
    "pyfaidx",
    "pysam",
    "requests",
    "slugid",
    "sortedcontainers",
    "tqdm",
    "smart_open",
    "polars",
    "oxbow>=0.7.0",
    "apsw",
    "sosqlite>=0.3.1",
    "biopython",
    "shortuuid",
    "pybigtools",
    "scipy"
]
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
urls = { homepage = "https://github.com/higlass/clodius" }

[project.scripts]
clodius = "clodius.cli.aggregate:cli"
tsv_to_mrmatrix = "clodius._tsv_to_mrmatrix:main"

[project.optional-dependencies]
dev = [
    "bumpversion",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E",  # pycodestyle error
    "W",  # pycodestyle warning
    "F",  # pyflakes
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "E501",  # line too long
    "E722",  # do not use bare 'except'
]

[tool.ruff.lint.per-file-ignores]
# F401: re-exports. E402: submodules that must be imported after the objects
# they register against are defined (see clodius/cli/__init__.py).
"__init__.py" = ["E402", "F401"]

[tool.pytest.ini_options]
addopts = "--cov=clodius --tb=native"
testpaths = ["test"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "return NotImplemented",
    "raise NotImplementedError",
]

[tool.hatch.envs.default]
features = ["dev"]
